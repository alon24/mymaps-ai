name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm ci
        working-directory: worker
      - run: npm test
        working-directory: worker
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Public config: Settings → Secrets and variables → Actions → Variables.
          # VITE_WORKER_URL comes from .env.production; an optional VITE_WORKER_URL variable overrides it.
          # (An unset variable would arrive as "" and wipe the .env value, hence the fallback.)
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL || 'https://mymaps-ai-worker.mymaps-ai-worker.workers.dev' }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ vars.VITE_GOOGLE_API_KEY }}
      - name: Check the build has the Worker URL (AI needs it)
        run: grep -rqF "${VITE_WORKER_URL:-https://mymaps-ai-worker.mymaps-ai-worker.workers.dev}" dist/assets || { echo "::error::Worker URL missing from the build"; exit 1; }
        env:
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Deploys the Cloudflare Worker when the CLOUDFLARE_API_TOKEN secret exists (see README).
  deploy-worker:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Public OAuth client id: lets the Worker accept users signed in with Google
      GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version-file: .nvmrc
      - run: |
          npm ci
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            npx wrangler deploy --var "GOOGLE_CLIENT_ID:$GOOGLE_CLIENT_ID"
          else
            npx wrangler deploy
          fi
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
      - run: echo "CLOUDFLARE_API_TOKEN not set — skipping Worker deploy."
        if: env.CLOUDFLARE_API_TOKEN == ''
