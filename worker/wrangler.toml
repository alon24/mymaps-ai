name = "mymaps-ai-worker"
main = "src/index.js"
compatibility_date = "2026-08-15"

# Secrets (set with `npx wrangler secret put <NAME>`, never commit):
#   OPENROUTER_API_KEY, APP_TOKEN (optional admin key)
#
# Google sign-in auth: GOOGLE_CLIENT_ID is passed at deploy time by CI
# (`--var GOOGLE_CLIENT_ID:...` from the VITE_GOOGLE_CLIENT_ID GitHub variable).
# keep_vars stops deploys from wiping other variables set in the dashboard.
keep_vars = true

# MODEL overrides DEFAULT_MODEL in src/index.js. Remove this block to fall back
# to the default (qwen/qwen3.5-plus-20260420).
[vars]
MODEL = "openai/gpt-4o-mini"

# Who may use the apps with Google sign-in. Users are managed from the Travel Hub admin page (shared users
# database below). ADMIN_EMAILS are always admins, so the owner can't be locked out; ALLOWED_EMAILS is a fallback
# list of users. Comma separated; each entry is an address or sha256:<hex of the lowercased address>
# (hashes keep addresses out of this public repo): printf '%s' 'friend@gmail.com' | sha256sum
ADMIN_EMAILS = "sha256:bb92649b6d5241648bc0d2cba48ea79ea61f022fef80dc20ab6e0d1e0b7d038d"
ALLOWED_EMAILS = "sha256:bb92649b6d5241648bc0d2cba48ea79ea61f022fef80dc20ab6e0d1e0b7d038d,sha256:eabd359b85e6fe1813bdb8e81686391e65c4877aba0afc421a4b350ddce078f5"

# One user list + audit log for Travel Hub, MyMaps AI and Skyhop (src/accounts.js). Skyhop's Worker binds the same
# database. Tables are created on first use, so there is no migration step.
[[d1_databases]]
binding = "DB"
database_name = "travel-hub-users"
database_id = "64412ffb-2944-493b-be05-24b5151c8f06"
